services:
  postgres:
    image: postgres:16-alpine
    container_name: jobpulse_postgres
    environment:
      POSTGRES_USER: jobpulse
      POSTGRES_PASSWORD: jobpulse
      POSTGRES_DB: jobpulse_dev
    ports:
      - "5435:5432"
    volumes:
      - jobpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpulse -d jobpulse_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  jobpulse_pgdata:
    name: jobpulse_pgdata
