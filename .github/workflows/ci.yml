name: Smoke CI (health-only)
on:
  push: { branches: [ main, presentation ] }
  pull_request: { branches: [ main, presentation ] }
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: requirements.txt }
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Run offline tests (health only)
        env: { PYTHONPATH: src }
        run: |
          pytest -q tests/test_health.py tests/test_health_he.py
      - name: Summary
        run: |
          echo "✅ Offline health tests passed (no services, no server)." >> $GITHUB_STEP_SUMMARY
